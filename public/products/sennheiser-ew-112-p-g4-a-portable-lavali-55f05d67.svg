<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1825"/><stop offset="1" stop-color="#0a1a2a"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#444"/><stop offset=".3" stop-color="#555"/><stop offset=".7" stop-color="#444"/><stop offset="1" stop-color="#333"/></linearGradient>
    <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4a4a"/><stop offset="1" stop-color="#2a2a2a"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Mic body/handle -->
  <rect x="188" y="120" width="24" height="160" rx="4" fill="url(#body)"/>
  <!-- Body ring details -->
  <rect x="186" y="130" width="28" height="3" rx="1" fill="#555"/>
  <rect x="186" y="200" width="28" height="2" rx="1" fill="#555"/>
  <rect x="186" y="210" width="28" height="2" rx="1" fill="#555"/>
  <!-- Mesh grille head -->
  <ellipse cx="200" cy="80" rx="28" ry="45" fill="url(#mesh)" stroke="#555" stroke-width="1"/>
  <!-- Mesh pattern -->
  <g stroke="#555" stroke-width=".3" opacity=".5"><line x1="189.0" y1="45" x2="211.0" y2="45"/><line x1="187.4" y1="49" x2="212.6" y2="49"/><line x1="185.8" y1="53" x2="214.2" y2="53"/><line x1="184.2" y1="57" x2="215.8" y2="57"/><line x1="182.6" y1="61" x2="217.4" y2="61"/><line x1="181.0" y1="65" x2="219.0" y2="65"/><line x1="179.4" y1="69" x2="220.6" y2="69"/><line x1="177.8" y1="73" x2="222.2" y2="73"/><line x1="176.2" y1="77" x2="223.8" y2="77"/><line x1="175.4" y1="81" x2="224.6" y2="81"/><line x1="177.0" y1="85" x2="223.0" y2="85"/><line x1="178.6" y1="89" x2="221.4" y2="89"/><line x1="180.2" y1="93" x2="219.8" y2="93"/><line x1="181.8" y1="97" x2="218.2" y2="97"/><line x1="183.4" y1="101" x2="216.6" y2="101"/><line x1="185.0" y1="105" x2="215.0" y2="105"/><line x1="186.6" y1="109" x2="213.4" y2="109"/><line x1="188.2" y1="113" x2="211.8" y2="113"/></g>
  <!-- Windscreen highlight -->
  <ellipse cx="192" cy="65" rx="8" ry="20" fill="rgba(255,255,255,0.05)"/>
  <!-- Band ring -->
  <rect x="172" y="115" width="56" height="8" rx="4" fill="#3a3a3a" stroke="#4a4a4a" stroke-width=".5"/>
  <!-- Switch -->
  <rect x="182" y="155" width="8" height="18" rx="2" fill="#3a3a3a" stroke="#4a4a4a" stroke-width=".5"/>
  <!-- XLR connector hint at bottom -->
  <ellipse cx="200" cy="278" rx="10" ry="4" fill="#333" stroke="#444" stroke-width=".5"/>
  <text x="200" y="288" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#4FC3F7" opacity=".6" font-weight="600">Sennheiser</text>
</svg>