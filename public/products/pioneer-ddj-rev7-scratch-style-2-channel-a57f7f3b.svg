<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1825"/><stop offset="1" stop-color="#2a0a0a"/></linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#1a1a1a"/></linearGradient>
    <radialGradient id="platter"><stop offset="0" stop-color="#333"/><stop offset=".3" stop-color="#2a2a2a"/><stop offset=".6" stop-color="#252525"/><stop offset="1" stop-color="#1e1e1e"/></radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Controller body -->
  <rect x="40" y="60" width="320" height="190" rx="8" fill="url(#deck)" stroke="#3a3535" stroke-width="1"/>
  <!-- Left jog wheel -->
  <circle cx="130" cy="165" r="55" fill="url(#platter)" stroke="#3a3535" stroke-width="1.5"/>
  <circle cx="130" cy="165" r="40" fill="none" stroke="#2e2e2e" stroke-width=".5"/>
  <circle cx="130" cy="165" r="25" fill="none" stroke="#2e2e2e" stroke-width=".5"/>
  <circle cx="130" cy="165" r="8" fill="#333" stroke="#444" stroke-width="1"/>
  <!-- Right jog wheel -->
  <circle cx="270" cy="165" r="55" fill="url(#platter)" stroke="#3a3535" stroke-width="1.5"/>
  <circle cx="270" cy="165" r="40" fill="none" stroke="#2e2e2e" stroke-width=".5"/>
  <circle cx="270" cy="165" r="25" fill="none" stroke="#2e2e2e" stroke-width=".5"/>
  <circle cx="270" cy="165" r="8" fill="#333" stroke="#444" stroke-width="1"/>
  <!-- Center mixer section -->
  <rect x="175" y="75" width="50" height="160" rx="3" fill="#252525" stroke="#3a3535" stroke-width=".5"/>
  <!-- Faders -->
  <rect x="182" y="140" width="6" height="60" rx="1" fill="#1a1a1a"/>
  <rect x="196" y="140" width="6" height="60" rx="1" fill="#1a1a1a"/>
  <rect x="210" y="140" width="6" height="60" rx="1" fill="#1a1a1a"/>
  <!-- Fader caps -->
  <rect x="180" y="155" width="10" height="8" rx="2" fill="#444"/>
  <rect x="194" y="170" width="10" height="8" rx="2" fill="#444"/>
  <rect x="208" y="160" width="10" height="8" rx="2" fill="#444"/>
  <!-- Performance pads -->
  <rect x="65" y="85" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="81" y="85" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="97" y="85" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="113" y="85" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="65" y="101" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="81" y="101" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="97" y="101" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="113" y="101" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="285" y="85" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="301" y="85" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="317" y="85" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="333" y="85" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="285" y="101" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="301" y="101" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="317" y="101" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/><rect x="333" y="101" width="12" height="12" rx="2" fill="#2a2a2a" stroke="#3a3535" stroke-width=".5"/>
  <!-- Jog highlights -->
  <circle cx="130" cy="145" r="15" fill="rgba(255,255,255,0.02)"/>
  <circle cx="270" cy="145" r="15" fill="rgba(255,255,255,0.02)"/>
  <text x="200" y="288" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#EF5350" opacity=".6" font-weight="600">Pioneer</text>
</svg>