<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1825"/><stop offset="1" stop-color="#0a1a1a"/></linearGradient>
    <linearGradient id="pbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#333"/><stop offset="1" stop-color="#222"/></linearGradient>
    <radialGradient id="lens"><stop offset="0" stop-color="#26A69A" stop-opacity=".3"/><stop offset=".5" stop-color="#1a3a3a"/><stop offset="1" stop-color="#111"/></radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Light beam -->
  <polygon points="95,140 40,260 360,260 305,140" fill="rgba(38,166,154,0.03)"/>
  <!-- Projector body -->
  <rect x="95" y="90" width="210" height="110" rx="8" fill="url(#pbody)" stroke="#444" stroke-width="1"/>
  <!-- Lens -->
  <circle cx="160" cy="145" r="38" fill="url(#lens)" stroke="#444" stroke-width="1.5"/>
  <circle cx="160" cy="145" r="28" fill="#1a2a2a" stroke="#333" stroke-width="1"/>
  <circle cx="160" cy="145" r="14" fill="#0f1f1f" stroke="#26A69A" stroke-width=".5" opacity=".5"/>
  <!-- Vents -->
  <g stroke="#2a2a2a" stroke-width="1"><line x1="230" y1="110" x2="290" y2="110"/><line x1="230" y1="116" x2="290" y2="116"/><line x1="230" y1="122" x2="290" y2="122"/><line x1="230" y1="128" x2="290" y2="128"/><line x1="230" y1="134" x2="290" y2="134"/><line x1="230" y1="140" x2="290" y2="140"/><line x1="230" y1="146" x2="290" y2="146"/><line x1="230" y1="152" x2="290" y2="152"/><line x1="230" y1="158" x2="290" y2="158"/><line x1="230" y1="164" x2="290" y2="164"/><line x1="230" y1="170" x2="290" y2="170"/></g>
  <!-- Controls -->
  <circle cx="260" cy="120" r="4" fill="#333" stroke="#444" stroke-width=".5"/>
  <circle cx="275" cy="120" r="4" fill="#333" stroke="#444" stroke-width=".5"/>
  <rect x="250" y="160" width="40" height="20" rx="2" fill="#2a2a2a" stroke="#333" stroke-width=".5"/>
  <!-- Power LED -->
  <circle cx="260" cy="185" r="2.5" fill="#26A69A" opacity=".9"/>
  <!-- Feet -->
  <rect x="110" y="198" width="20" height="6" rx="3" fill="#2a2a2a"/>
  <rect x="270" y="198" width="20" height="6" rx="3" fill="#2a2a2a"/>
  <text x="200" y="288" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#26A69A" opacity=".6" font-weight="600">Epson</text>
</svg>