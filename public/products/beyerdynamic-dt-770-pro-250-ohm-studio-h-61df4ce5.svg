<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1825"/><stop offset="1" stop-color="#101520"/></linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#222"/></linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#444"/><stop offset="1" stop-color="#2a2a2a"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Headband -->
  <path d="M120,130 Q120,50 200,40 Q280,50 280,130" fill="none" stroke="#444" stroke-width="8" stroke-linecap="round"/>
  <path d="M120,130 Q120,55 200,45 Q280,55 280,130" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <!-- Left ear cup -->
  <ellipse cx="120" cy="165" rx="40" ry="50" fill="url(#cup)" stroke="#4a4a4a" stroke-width="1.5"/>
  <ellipse cx="120" cy="165" rx="30" ry="38" fill="url(#pad)" stroke="#3a3a3a" stroke-width=".8"/>
  <ellipse cx="120" cy="165" rx="20" ry="25" fill="#2a2a2a"/>
  <!-- Right ear cup -->
  <ellipse cx="280" cy="165" rx="40" ry="50" fill="url(#cup)" stroke="#4a4a4a" stroke-width="1.5"/>
  <ellipse cx="280" cy="165" rx="30" ry="38" fill="url(#pad)" stroke="#3a3a3a" stroke-width=".8"/>
  <ellipse cx="280" cy="165" rx="20" ry="25" fill="#2a2a2a"/>
  <!-- Adjustment sliders -->
  <rect x="108" y="125" width="24" height="15" rx="3" fill="#3a3a3a" stroke="#4a4a4a" stroke-width=".5"/>
  <rect x="268" y="125" width="24" height="15" rx="3" fill="#3a3a3a" stroke="#4a4a4a" stroke-width=".5"/>
  <!-- Cable -->
  <path d="M120,215 Q120,250 140,260 Q160,270 160,290" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="288" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#78909C" opacity=".6" font-weight="600">Beyerdynamic</text>
</svg>