<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1825"/><stop offset="1" stop-color="#1a1a0a"/></linearGradient>
    <radialGradient id="beam" cx=".5" cy=".2" r=".8"><stop offset="0" stop-color="#FFD54F" stop-opacity=".15"/><stop offset="1" stop-color="#FFD54F" stop-opacity="0"/></radialGradient>
    <linearGradient id="fix" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#333"/><stop offset="1" stop-color="#1a1a1a"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Light beam -->
  <ellipse cx="200" cy="200" rx="120" ry="80" fill="url(#beam)"/>
  <!-- Yoke/mount -->
  <rect x="190" y="20" width="20" height="30" rx="2" fill="#333"/>
  <rect x="170" y="48" width="60" height="6" rx="3" fill="#3a3a3a"/>
  <!-- PAR body -->
  <ellipse cx="200" cy="100" rx="60" ry="25" fill="#2a2a2a" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="140" y="100" width="120" height="80" rx="0" fill="url(#fix)"/>
  <ellipse cx="200" cy="180" rx="60" ry="25" fill="#222" stroke="#3a3a3a" stroke-width="1"/>
  <!-- LEDs inside -->
  <circle cx="175" cy="140" r="6" fill="#EF5350" opacity=".35"/><circle cx="175" cy="140" r="3" fill="#EF5350" opacity=".6"/><circle cx="200" cy="130" r="6" fill="#4FC3F7" opacity=".35"/><circle cx="200" cy="130" r="3" fill="#4FC3F7" opacity=".6"/><circle cx="225" cy="140" r="6" fill="#4CAF50" opacity=".35"/><circle cx="225" cy="140" r="3" fill="#4CAF50" opacity=".6"/><circle cx="185" cy="160" r="6" fill="#FFD54F" opacity=".35"/><circle cx="185" cy="160" r="3" fill="#FFD54F" opacity=".6"/><circle cx="215" cy="160" r="6" fill="#AB47BC" opacity=".35"/><circle cx="215" cy="160" r="3" fill="#AB47BC" opacity=".6"/><circle cx="175" cy="175" r="6" fill="#FF7043" opacity=".35"/><circle cx="175" cy="175" r="3" fill="#FF7043" opacity=".6"/><circle cx="200" cy="185" r="6" fill="#26A69A" opacity=".35"/><circle cx="200" cy="185" r="3" fill="#26A69A" opacity=".6"/><circle cx="225" cy="175" r="6" fill="#F68B1E" opacity=".35"/><circle cx="225" cy="175" r="3" fill="#F68B1E" opacity=".6"/>
  <!-- Barn door hints -->
  <line x1="142" y1="100" x2="142" y2="180" stroke="#3a3a3a" stroke-width="1"/>
  <line x1="258" y1="100" x2="258" y2="180" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Side ribs -->
  <g stroke="#2e2e2e" stroke-width=".5"><line x1="145" y1="108" x2="255" y2="108"/><line x1="145" y1="116" x2="255" y2="116"/><line x1="145" y1="124" x2="255" y2="124"/><line x1="145" y1="132" x2="255" y2="132"/><line x1="145" y1="140" x2="255" y2="140"/><line x1="145" y1="148" x2="255" y2="148"/><line x1="145" y1="156" x2="255" y2="156"/><line x1="145" y1="164" x2="255" y2="164"/><line x1="145" y1="172" x2="255" y2="172"/></g>
  <text x="200" y="288" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#FFD54F" opacity=".6" font-weight="600">Chauvet</text>
</svg>