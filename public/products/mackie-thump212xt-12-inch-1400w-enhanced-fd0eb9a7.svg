  <circle cx="200" cy="75" r="28" fill="url(#horn)" stroke="#3a3a3a" stroke-width="1.2"/>
  <circle cx="200" cy="75" r="15" fill="#2a2a2a" stroke="#444" stroke-width=".8"/>
  <circle cx="200" cy="75" r="6" fill="#383838"/>
  <!-- LED indicator -->
  <circle cx="200" cy="260" r="3" fill="#F68B1E" opacity=".9" filter="url(#glow)"/>
  <!-- Handle -->
  <rect x="185" y="28" width="30" height="6" rx="3" fill="#333" stroke="#444" stroke-width=".5"/>
