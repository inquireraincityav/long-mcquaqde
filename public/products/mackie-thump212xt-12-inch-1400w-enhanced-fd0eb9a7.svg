"/><line x1="135" y1="260" x2="265" y2="260"/><line x1="135" y1="265" x2="265" y2="265"/></g>
  <!-- Woofer -->
  <circle cx="200" cy="175" r="55" fill="url(#cone)" stroke="#3a3a3a" stroke-width="1.5"/>
  <circle cx="200" cy="175" r="42" fill="none" stroke="#333" stroke-width="1"/>
  <circle cx="200" cy="175" r="30" fill="none" stroke="#2e2e2e" stroke-width=".7"/>
  <circle cx="200" cy="175" r="12" fill="url(#dust)" stroke="#444" stroke-width="1"/>
