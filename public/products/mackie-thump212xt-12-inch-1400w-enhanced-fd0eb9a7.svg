  <rect x="130" y="25" width="3" height="250" rx="1" fill="rgba(255,255,255,0.04)"/>
  <text x="200" y="288" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#F68B1E" opacity=".6" font-weight="600">Mackie</text>
</svg>