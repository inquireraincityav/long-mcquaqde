<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1825"/><stop offset="1" stop-color="#2a1a10"/></linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#1a1a1a"/></linearGradient>
    <radialGradient id="cone"><stop offset="0" stop-color="#333"/><stop offset=".5" stop-color="#222"/><stop offset=".8" stop-color="#2a2a2a"/><stop offset="1" stop-color="#1a1a1a"/></radialGradient>
    <radialGradient id="dust"><stop offset="0" stop-color="#444"/><stop offset="1" stop-color="#222"/></radialGradient>
    <radialGradient id="horn"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#1e1e1e"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Speaker cabinet -->
  <rect x="130" y="25" width="140" height="250" rx="6" fill="url(#cab)" stroke="#3a3535" stroke-width="1.5"/>
  <!-- Grille texture lines -->
