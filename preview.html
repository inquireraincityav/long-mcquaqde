const h=React.createElement,{useState,useReducer,useContext,createContext,useCallback,useMemo,Fragment:F}=React;

'Yorkville Sound Tripod Boom Stand - Black':{s:'Yorkville Tripod Stand',sp:'Boom stand \xb7 black',sk:'TBS-BLK-001',r:4.9,rv:56,c:'New',ds:{Type:'Tripod boom',Color:'Black','Max Height':'6.5 ft',Weight:'8 lbs'}},

'Zoom Q8N Handheld 4K video and audio Recorder':{s:'Zoom Q8N-4K Recorder',sp:'4K video \xb7 XY stereo mic',sk:'ZM-Q8N-001',r:4.7,rv:22,c:'Excellent',ds:{Video:'4K/30fps',Audio:'XY stereo mic',Storage:'microSD',Battery:'2 hrs'}},

'Yorkville 8-Channel Passive Mixer':{s:'Yorkville 8-Ch Mixer',sp:'8 channel \xb7 passive',sk:'PGM8-001',r:4.4,rv:16,c:'Excellent',ds:{Channels:'8',Type:'Passive'}},
'Yorkville 14-Channel Compact Desk Mixer':{s:'Yorkville 14-Ch Mixer',sp:'14 channel \xb7 compact desk',sk:'VGM14-001',r:4.5,rv:23,c:'Excellent',ds:{Channels:'14',Type:'Analog desk',EQ:'3-band'}},
'Mackie ProFX16v3 16-Channel Professional Effects Mixer':{s:'Mackie ProFX16v3 Mixer',sp:'16 channel \xb7 USB \xb7 effects',sk:'PFX16V3-001',r:4.7,rv:38,c:'Excellent',ds:{Channels:'16',Type:'Analog + USB',Effects:'GigFX',Preamps:'Onyx'}},

function gd(p){return DM[p]||{s:p.split(' ').slice(0,3).join(' '),sp:'',sk:null,r:null,rv:0,c:null,ds:{}};}
function fp(n){return n!=null?'$'+n:'TBD';}
function dbt(s,e){if(!s||!e)return 0;return Math.max(Math.ceil((new Date(e)-new Date(s))/864e5),1);}
function itemTot(item,days){if(!item.day)return null;if(days<=0)return 0;const m=Math.floor(days/30),r=days%30;if(item.month&&m>=1)return m*item.month+r*item.day;return days*item.day;}
const CATS=['Speakers','Microphones','Mixers & Extras','Visual'];
function hsh(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return Math.abs(h);}
function sr(seed){let x=Math.sin(seed)*10000;return x-Math.floor(x);}
const LOCS=[{id:'van-broadway',n:'Vancouver (Broadway)'},{id:'van-main',n:'Vancouver (Main St)'},{id:'burnaby',n:'Burnaby'},{id:'surrey',n:'Surrey'},{id:'richmond',n:'Richmond'}];
function avC(p){const h2=hsh(p);return LOCS.filter((_,i)=>sr(h2+i)>0.25).length;}

// KIT MATCHER
const tmplMap={corporate_panel:'Panel/Conference Package',wedding_ceremony:'Standard PA Package',wedding_reception:'Standard PA Package',dj_set:'Standard PA Package'};
const KIT_TMPLS=[
{name:'Panel/Conference Package',items:[{p:'Yorkville Sound YXL12P 12 Inch 1000 Watt Powered Loudspeaker',q:2},{p:'Yorkville 14-Channel Compact Desk Mixer',q:1},{p:'Shure SM58 Unidirectional/Cardioid Dynamic Microphone',q:3},{p:'Sennheiser EW 112-P G4-A Portable Lavalier Set',q:1},{p:'Yorkville Sound Tripod Boom Stand - Black',q:3}]},
{name:'Standard PA Package',items:[{p:'Yorkville Sound YXL12P 12 Inch 1000 Watt Powered Loudspeaker',q:2},{p:'Yorkville 14-Channel Compact Desk Mixer',q:1},{p:'Shure SM58 Unidirectional/Cardioid Dynamic Microphone',q:2},{p:'Yorkville Sound Tripod Boom Stand - Black',q:2}]}
];
const invByP=Object.fromEntries(INV.map(i=>[i.product,i]));
function buildKit(eType,gc,venue){
  if(eType!=='custom'){const tn=tmplMap[eType];if(tn){const t=KIT_TMPLS.find(x=>x.name===tn);if(t)return{type:'template',label:'Matches our '+t.name,items:t.items.map(ti=>({...invByP[ti.p],product:ti.p,qty:ti.q}))}}}
  return{type:'heuristic',label:'Suggested based on your event size',tierLabel:'Closest match: 100-200 guest tier',items:[
    {...invByP[INV[0].product],product:INV[0].product,qty:2},
    {...invByP[INV[7].product],product:INV[7].product,qty:3},
    {...invByP[INV[11].product],product:INV[11].product,qty:1},
    {...invByP[INV[2].product],product:INV[2].product,qty:3}
  ],rule:{wattsPerGuest:'7-8',venue:venue||'Indoor',guestCount:'100-200',speakerCount:2,wirelessMics:0,wiredMics:3,mixerChannelsMin:8}};
}

// CART
const CartCtx=createContext(null);
function cartR(st,a){
  switch(a.type){
    case'ADD':{const ex=st.items.find(i=>i.product===a.p.product);if(ex)return{...st,items:st.items.map(i=>i.product===a.p.product?{...i,qty:i.qty+(a.p.qty||1)}:i)};return{...st,items:[...st.items,{...a.p,qty:a.p.qty||1,dr:a.p.dr||st.dr}]};}
    case'KIT':{const m=[...st.items];for(const ki of a.items){const idx=m.findIndex(i=>i.product===ki.product);if(idx>=0)m[idx]={...m[idx],qty:m[idx].qty+ki.qty};else m.push({...ki,dr:a.dr||st.dr});}return{...st,items:m,dr:a.dr||st.dr};}
    case'RM':return{...st,items:st.items.filter(i=>i.product!==a.product)};
    case'QTY':return{...st,items:st.items.map(i=>i.product===a.product?{...i,qty:Math.max(1,a.qty)}:i)};
    case'CLR':return{items:[],dr:{start:'',end:''}};
    default:return st;
  }
}
function CartProv({children}){const[st,d]=useReducer(cartR,{items:[],dr:{start:'',end:''}});const cnt=st.items.reduce((s,i)=>s+i.qty,0);return h(CartCtx.Provider,{value:{...st,cnt,d}},children);}
